<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Página no encontrada | BYD Stats</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#07070f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #07070f;
      color: #f0eff8;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px;
      overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: .4;
    }
    .container { position: relative; z-index: 1; }
    h1 {
      font-size: clamp(4rem, 10vw, 8rem); font-weight: 900; margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, #d4d0f5 50%, #ff1a40 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1; letter-spacing: -0.03em;
    }
    p { font-size: 1.2rem; color: #8b89a8; margin-bottom: 40px; }
    .btn {
      display: inline-flex; padding: 14px 28px; border-radius: 12px; font-size: 1rem; font-weight: 600;
      background: linear-gradient(135deg, #EA0029, #c40024); color: #fff; text-decoration: none;
      box-shadow: 0 4px 24px rgba(234,0,41,0.35); transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(234,0,41,0.45); }
    
    @media (max-width: 768px) { body::before { display: none; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Ups, parece que te has salido de la ruta. La página no existe.</p>
    <a href="/" class="btn">Volver a la portada</a>
  </div>
</body>
</html>
