<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Feedback — BYD Stats</title>
  <script src="https://www.google.com/recaptcha/api.js?render=6Le7TRUtAAAAACj5coE5RoyoNzAgiqHmom3uyBq5"></script>
  <style>
    :root{--red:#ea0029;--bg:#0f1115;--card:#171a21;--text:#f4f4f5;--muted:#a1a1aa;--accent:#a855f7;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px;}
    .wrap{max-width:560px;margin:0 auto;}
    h1{font-size:1.4rem;margin-bottom:6px;}
    p.sub{color:var(--muted);font-size:.9rem;margin-bottom:20px;}
    .seg{display:flex;gap:8px;margin-bottom:18px;}
    .seg button{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:var(--card);color:var(--text);font-weight:600;cursor:pointer;}
    .seg button[aria-selected="true"]{background:linear-gradient(135deg,#6c3de0,#a855f7);border-color:transparent;}
    label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px;}
    input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0c0e12;color:var(--text);font-size:.95rem;}
    textarea{min-height:90px;resize:vertical;}
    .row{display:flex;gap:12px;}.row>div{flex:1;}
    .imp{display:none;}
    button.submit{width:100%;margin-top:22px;padding:15px;border:0;border-radius:14px;font-weight:700;font-size:1rem;color:#fff;background:linear-gradient(135deg,#6c3de0,#a855f7);cursor:pointer;}
    button.submit:disabled{opacity:.5;cursor:not-allowed;}
    .msg{margin-top:16px;padding:14px;border-radius:12px;font-size:.9rem;display:none;}
    .msg.ok{display:block;background:rgba(34,197,94,.15);color:#86efac;}
    .msg.err{display:block;background:rgba(239,68,68,.15);color:#fca5a5;}
    .link{display:block;text-align:center;margin-top:18px;font-size:.85rem;color:var(--muted);}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Enviar feedback</h1>
    <p class="sub">Reporta un fallo o propón una mejora. Los datos sensibles se mantienen privados.</p>
    <div class="seg" role="tablist">
      <button id="tab-bug" role="tab" aria-selected="true" onclick="setType('bug')">🐞 Reportar fallo</button>
      <button id="tab-imp" role="tab" aria-selected="false" onclick="setType('improvement')">💡 Proponer mejora</button>
    </div>
    <form id="f">
      <label>Título *</label>
      <input id="title" maxlength="140" required />
      <label>Descripción *</label>
      <textarea id="description" maxlength="5000" required></textarea>

      <div class="bugOnly">
        <label>Pasos para reproducir (uno por línea)</label>
        <textarea id="steps" maxlength="2000"></textarea>
        <div class="row">
          <div><label>Resultado esperado</label><input id="expected" maxlength="2000" /></div>
          <div><label>Resultado actual</label><input id="actual" maxlength="2000" /></div>
        </div>
      </div>
      <div class="impOnly imp">
        <label>¿Qué problema resuelve?</label>
        <input id="problemSolved" maxlength="2000" />
        <label>Contexto o caso de uso</label>
        <input id="useCase" maxlength="2000" />
      </div>

      <div class="row">
        <div><label>Plataforma *</label>
          <select id="platform"><option value="android">Android</option><option value="ios">iOS</option><option value="web">Web</option><option value="other">Otra</option></select>
        </div>
        <div><label>Versión de la app</label><input id="appVersion" maxlength="40" placeholder="1.2.57" /></div>
      </div>
      <label>Email de contacto (opcional)</label>
      <input id="contactEmail" type="email" maxlength="200" placeholder="por si necesitamos detalles" />
      <label>Adjuntos (máx 3 · imágenes/logs · ≤10MB)</label>
      <input id="files" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.txt,.log,.json" />

      <button class="submit" id="send" type="submit">Enviar</button>
      <div class="msg" id="msg"></div>
    </form>
    <a class="link" href="/estado/">Ver estado de reportes →</a>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
    // Firebase web config — public values, copy from BYD-Stats-Premium/.env (VITE_FIREBASE_*)
    const firebaseConfig = {
      apiKey: "AIzaSyDKFI03RfiuEcMPcsfnvGK9u-ItZvG9KDw",
      authDomain: "byd-stats-c8dbf.firebaseapp.com",
      projectId: "byd-stats-c8dbf",
      storageBucket: "byd-stats-c8dbf.firebasestorage.app",
      messagingSenderId: "689099974608",
      appId: "1:689099974608:web:1b7a86f56e324660f53bd5",
    };
    initializeApp(firebaseConfig);
    const FN = 'https://europe-west1-byd-stats-c8dbf.cloudfunctions.net/submitFeedbackPublic';
    const SITE_KEY = '6Le7TRUtAAAAACj5coE5RoyoNzAgiqHmom3uyBq5';
    const ALLOWED = ['image/png','image/jpeg','image/webp','text/plain','application/json'];
    const MAX = 10*1024*1024;
    let type = 'bug';
    window.setType = (t) => {
      type = t;
      document.getElementById('tab-bug').setAttribute('aria-selected', t==='bug');
      document.getElementById('tab-imp').setAttribute('aria-selected', t==='improvement');
      document.querySelector('.bugOnly').style.display = t==='bug' ? '' : 'none';
      document.querySelector('.impOnly').style.display = t==='improvement' ? '' : 'none';
    };
    const $ = (id) => document.getElementById(id);
    const show = (cls, text) => { const m=$('msg'); m.className='msg '+cls; m.textContent=text; };

    $('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('send').disabled = true; show('', '');
      try {
        const files = Array.from($('files').files || []);
        if (files.length > 3) throw new Error('Máximo 3 adjuntos.');
        for (const f of files) {
          const mime = f.type || 'application/octet-stream';
          if (!ALLOWED.includes(mime)) throw new Error(`Tipo no permitido: ${f.name}`);
          if (f.size > MAX) throw new Error(`Demasiado grande: ${f.name}`);
        }
        const report = {
          type, title: $('title').value.trim(), description: $('description').value.trim(),
          platform: $('platform').value, appVersion: $('appVersion').value.trim() || undefined,
          contactEmail: $('contactEmail').value.trim() || undefined,
          attachments: files.map(f => ({ name: f.name, mimeType: f.type, size: f.size })),
        };
        if (type === 'bug') {
          report.stepsToReproduce = $('steps').value.split('\n').map(s=>s.trim()).filter(Boolean);
          report.expectedResult = $('expected').value.trim() || undefined;
          report.actualResult = $('actual').value.trim() || undefined;
        } else {
          report.problemSolved = $('problemSolved').value.trim() || undefined;
          report.useCase = $('useCase').value.trim() || undefined;
        }
        const recaptchaToken = await grecaptcha.execute(SITE_KEY, { action: 'feedback' });
        const resp = await fetch(FN, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recaptchaToken, report }),
        });
        if (!resp.ok) { const j = await resp.json().catch(()=>({})); throw new Error(j.error || 'Error al enviar'); }
        const { shortId, uploadUrls } = await resp.json();
        for (let i = 0; i < files.length; i++) {
          const u = uploadUrls.find(x => x.name === files[i].name);
          if (u) await fetch(u.url, { method: 'PUT', headers: { 'Content-Type': files[i].type }, body: files[i] });
        }
        show('ok', `¡Gracias! Tu reporte #${shortId} se ha registrado.`);
        $('f').reset();
      } catch (err) {
        show('err', err.message || 'No se pudo enviar. Inténtalo más tarde.');
      } finally {
        $('send').disabled = false;
      }
    });
  </script>
</body>
</html>
