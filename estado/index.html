<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Estado de reportes — BYD Stats</title>
  <style>
    :root{--bg:#0f0e1a;--card:#222734;--text:#f4f4f5;--muted:#9aa3b2;--red:#EA0029;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);min-height:100vh;padding:24px;background-color:var(--bg);background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(234,0,41,.18) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 60%,rgba(108,61,224,.12) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 20% 80%,rgba(26,23,48,.8) 0%,transparent 70%);background-attachment:fixed;}
    .wrap{max-width:1240px;margin:0 auto;}
    h1{font-size:1.4rem;margin-bottom:18px;display:flex;align-items:center;gap:9px;}
    h1::before{content:'';width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,#ff1a40,var(--red));box-shadow:0 0 12px rgba(234,0,41,.6);}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
    .col{position:relative;background:linear-gradient(180deg,#171b24 0%,#12151c 100%);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px 11px;min-height:50vh;box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);}
    .col::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;border-radius:16px 16px 0 0;background:var(--dot,#a1a1aa);}
    .col[data-stage=pending]{--dot:#a1a1aa;}
    .col[data-stage=wip]{--dot:#f59e0b;}
    .col[data-stage=test]{--dot:#0a84ff;}
    .col[data-stage=production]{--dot:#3ddc84;}
    .col h2{display:flex;align-items:center;gap:8px;font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:6px 4px 14px;}
    .col h2::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--dot,#a1a1aa);box-shadow:0 0 8px var(--dot,#a1a1aa);}
    .count{margin-left:auto;background:rgba(255,255,255,.10);border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:700;color:var(--muted);}
    .item{background:linear-gradient(180deg,#2a3040,#222734);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:11px 13px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,.4);}
    .item .t{font-weight:600;font-size:.9rem;line-height:1.3;}
    .item .m{color:var(--muted);font-size:.78rem;margin-top:5px;}
    .pill{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(234,0,41,.18);color:#ff7d92;margin-right:6px;}
    .empty{color:var(--muted);font-size:.82rem;padding:4px;}
    @media(max-width:900px){.board{grid-template-columns:1fr;}.col{min-height:auto;}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Estado de reportes</h1>
    <div id="board" class="board"></div>
    <p class="empty" id="loading">Cargando…</p>
  </div>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
    import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';
    const firebaseConfig = {
      apiKey: "AIzaSyDKFI03RfiuEcMPcsfnvGK9u-ItZvG9KDw", authDomain: "byd-stats-c8dbf.firebaseapp.com",
      projectId: "byd-stats-c8dbf", storageBucket: "byd-stats-c8dbf.firebasestorage.app",
      messagingSenderId: "689099974608", appId: "1:689099974608:web:1b7a86f56e324660f53bd5",
    };
    const db = getFirestore(initializeApp(firebaseConfig));
    const STAGES = [['pending','Pendiente'],['wip','En curso'],['test','En pruebas'],['production','Publicado']];
    const TYPES = { bug:'🐞 Fallo', improvement:'💡 Mejora' };
    (async () => {
      const snap = await getDocs(query(collection(db, 'reports_public'), orderBy('updatedAt','desc')));
      const byStage = {}; STAGES.forEach(([k]) => byStage[k] = []);
      snap.forEach(d => { const r = d.data(); if (byStage[r.status]) byStage[r.status].push(r); });
      const board = document.getElementById('board');
      document.getElementById('loading').remove();
      for (const [k, label] of STAGES) {
        const col = document.createElement('div'); col.className = 'col'; col.dataset.stage = k;
        col.innerHTML = `<h2>${label} <span class="count">${byStage[k].length}</span></h2>`;
        if (!byStage[k].length) { col.innerHTML += `<p class="empty">— sin reportes —</p>`; }
        for (const r of byStage[k]) {
          const el = document.createElement('div'); el.className = 'item';
          el.innerHTML = `<div class="t"><span class="pill">#${r.shortId}</span>${TYPES[r.type]||''} ${escapeHtml(r.title)}</div>`
            + (r.summary ? `<div class="m">${escapeHtml(r.summary)}</div>` : '')
            + `<div class="m">${escapeHtml(r.platform||'')}${r.appVersion?(' · v'+escapeHtml(r.appVersion)):''}</div>`;
          col.appendChild(el);
        }
        board.appendChild(col);
      }
    })();
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  </script>
</body>
</html>
